<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Twitch Clips · Редактор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d111b;color:#f4f5fa;font:15px system-ui}main{max-width:760px;margin:auto;padding:20px 16px 110px}h1{font-size:25px;margin:5px 0}small{color:#9daac1}.panel{background:#181f30;border:1px solid #2b3549;border-radius:16px;padding:14px;margin:16px 0}select,button{font:inherit;border:1px solid #35415a;border-radius:10px;background:#242e43;color:white;padding:12px;min-height:44px}select{width:100%;margin-top:10px}button{cursor:pointer}button.active{border-color:#5ee9d0;color:#5ee9d0;background:#163b3c}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row button{flex:1}canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:10px;background:#080b12}label{display:inline-flex;gap:7px;align-items:center;padding:8px}input{width:20px;height:20px;accent-color:#5ee9d0}#hint{line-height:1.5;color:#b3bfd4}#status{min-height:30px;color:#5ee9d0;white-space:pre-wrap}footer{position:fixed;bottom:0;left:0;right:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#111827ed;border-top:1px solid #35415a;display:flex;gap:8px;justify-content:center}footer button{max-width:340px;flex:1}.primary{background:#59e5c5;color:#09241e;font-weight:700;border:0}#preview{display:block;width:min(100%,280px);margin:auto;border-radius:12px}button:disabled{opacity:.45}#stage{overflow:hidden}#error{color:#ffb4a8} .section-label{font-size:11px;letter-spacing:2px;color:#5ee9d0}
</style></head><body><main><small class="section-label">TWITCH CLIPS / STUDIO</small><h1>Собери свой кадр</h1><p id="clipMeta"></p><small>Камеры, контент и готовое видео 9:16</small>
<section class="panel"><label for="layout">Компоновка</label><select id="layout"><option>Только контент</option><option>Камеры + контент</option><option>Только камеры</option><option>Один кадр — заполнить</option><option>Один кадр — размытый фон</option></select><div id="toggles"></div></section>
<section class="panel"><b>Область для редактирования</b><div class="row" id="regions"></div><p id="hint">Нарисуй рамку пальцем. Внутри рамки — перемещение, за угол — изменение размера. Для новой рамки нажми «Выделить заново».</p><div id="stage"><canvas id="canvas" width="1280" height="720"></canvas></div><div class="row"><button id="reset">Выделить заново</button><button id="full">Весь кадр</button></div><small id="dimensions"></small></section>
<p id="status" role="status">Загрузка…</p><p id="error" role="alert"></p><section id="result" hidden class="panel"><h3>Предпросмотр</h3><canvas id="preview" width="1080" height="1920" aria-label="Предпросмотр вертикального кадра"></canvas></section></main><footer><button id="previewButton" disabled>Предпросмотр</button><button id="exportButton" class="primary" disabled>Сделать 9:16</button></footer>
<script>
const $=id=>document.getElementById(id),tg=window.Telegram?.WebApp;
tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();
const payload=JSON.parse(new URLSearchParams(location.hash.slice(1)).get('payload')||'null');
let data={boxes:{},cameras:['camera'],layout:'Камеры + контент'},size=[1280,720],selected='camera',loaded=false,busy=false,drag=null;
const cams=['camera','camera2','camera3','camera4'],names={camera:'Камера 1',camera2:'Камера 2',camera3:'Камера 3',camera4:'Камера 4',game:'Контент'},canvas=$('canvas'),ctx=canvas.getContext('2d'),img=new Image();
function invalidate(){ $('result').hidden=true;$('status').textContent='Области изменены. Обнови предпросмотр.';}
function controls(){const single=(data.layout.startsWith('Один кадр')||data.layout==='Только контент'),keys=single?['game']:data.layout==='Только камеры'?cams:[...cams,'game'];if(!keys.includes(selected))selected=keys[0];$('regions').replaceChildren();for(const key of keys){const b=document.createElement('button');b.textContent=names[key];b.className=key===selected?'active':'';b.onclick=()=>{selected=key;controls();draw();};$('regions').append(b);} $('toggles').replaceChildren();if(!single)for(const key of cams){const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=data.cameras.includes(key);check.onchange=()=>{data.cameras=cams.filter(c=>c===key?check.checked:data.cameras.includes(c));invalidate();draw();};label.append(check,names[key]);$('toggles').append(label);}}
function draw(){ctx.clearRect(0,0,...size);if(loaded)ctx.drawImage(img,0,0,...size);const scale=size[0]/canvas.getBoundingClientRect().width;for(const [key,b] of Object.entries(data.boxes)){const [x,y,w,h]=b;ctx.strokeStyle=key===selected?'#5ee9d0':'#f6cf6c';ctx.lineWidth=2*scale;ctx.strokeRect(x,y,w,h);ctx.font=`${12*scale}px sans-serif`;ctx.fillStyle='#07141dcc';ctx.fillRect(x,y,100*scale,22*scale);ctx.fillStyle='white';ctx.fillText(names[key],x+4*scale,y+15*scale);if(key===selected){ctx.fillStyle='#5ee9d0';for(const [cx,cy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]])ctx.fillRect(cx-5*scale,cy-5*scale,10*scale,10*scale);}}const b=data.boxes[selected];$('dimensions').textContent=b?names[selected]+': '+b.map(Math.round).join(' · '):names[selected]+': выдели область';}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(size[0],(e.clientX-r.left)*size[0]/r.width)),Math.max(0,Math.min(size[1],(e.clientY-r.top)*size[1]/r.height))];}
canvas.onpointerdown=e=>{if(!loaded||busy)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);const p=point(e),b=data.boxes[selected],tol=22*size[0]/canvas.getBoundingClientRect().width;drag={p,kind:'new'};if(b){const [x,y,w,h]=b;const corners=[[x,y],[x+w,y],[x,y+h],[x+w,y+h]];const hit=corners.findIndex(c=>Math.hypot(c[0]-p[0],c[1]-p[1])<tol);if(hit>=0)drag={p,kind:'resize',anchor:corners[3-hit]};else if(p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h)drag={p,kind:'move',box:[...b]};}invalidate();};
canvas.onpointermove=e=>{if(!drag)return;const p=point(e);let b;if(drag.kind==='move'){const [x,y,w,h]=drag.box;b=[Math.max(0,Math.min(size[0]-w,x+p[0]-drag.p[0])),Math.max(0,Math.min(size[1]-h,y+p[1]-drag.p[1])),w,h];}else{const a=drag.anchor||drag.p;b=[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.abs(a[0]-p[0]),Math.abs(a[1]-p[1])];}data.boxes[selected]=b;draw();};
function finish(){if(!drag)return;drag=null;const b=data.boxes[selected];if(b&&(b[2]<16||b[3]<16)){delete data.boxes[selected];$('status').textContent='Область слишком маленькая. Выдели заново.';}draw();}canvas.onpointerup=finish;canvas.onpointercancel=finish;
$('reset').onclick=()=>{delete data.boxes[selected];invalidate();draw();};$('full').onclick=()=>{data.boxes[selected]=[0,0,...size];invalidate();draw();};$('layout').onchange=()=>{data.layout=$('layout').value;invalidate();controls();draw();};window.addEventListener('resize',draw);
function validate(){const keys=(data.layout.startsWith('Один кадр')||data.layout==='Только контент')?['game']:[...data.cameras,...(data.layout==='Камеры + контент'?['game']:[])];if(!keys.length||(!(data.layout.startsWith('Один кадр')||data.layout==='Только контент')&&!data.cameras.length))throw Error('Включи хотя бы одну камеру.');for(const k of keys){const b=data.boxes[k];if(!b||b[2]<16||b[3]<16)throw Error('Выдели область: '+names[k]);}return keys;}
function preview(){const keys=validate(),c=$('preview'),p=c.getContext('2d');p.fillStyle='black';p.fillRect(0,0,1080,1920);
function paint(key,x,y,w,h,fill=false,blur=false){const [sx,sy,sw,sh]=data.boxes[key];const ratio=fill?Math.max(w/sw,h/sh):Math.min(w/sw,h/sh),dw=sw*ratio,dh=sh*ratio;p.save();p.beginPath();p.rect(x,y,w,h);p.clip();if(blur)p.filter='blur(30px)';p.drawImage(img,sx*img.naturalWidth/size[0],sy*img.naturalHeight/size[1],sw*img.naturalWidth/size[0],sh*img.naturalHeight/size[1],x+(w-dw)/2,y+(h-dh)/2,dw,dh);p.restore();}
if((data.layout.startsWith('Один кадр')||data.layout==='Только контент')){if(data.layout.endsWith('фон')){paint('game',0,0,1080,1920,true,true);paint('game',0,0,1080,1920);}else paint('game',0,0,1080,1920,data.layout!=='Только контент');}
else if(data.layout==='Только камеры')keys.forEach((k,i)=>paint(k,0,i*1920/keys.length,1080,1920/keys.length));
else{data.cameras.forEach((k,i)=>paint(k,i*1080/data.cameras.length,0,1080/data.cameras.length,540));paint('game',0,540,1080,1380);}
$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth'});$('status').textContent='Предпросмотр по обложке клипа. В видео положение объектов может меняться.';}
function action(kind){$('error').textContent='';try{validate();if(kind==='preview'){preview();return;}if(!tg)throw Error('Открой редактор кнопкой бота в Telegram.');const text=JSON.stringify({session:payload.session,data});if(new TextEncoder().encode(text).length>4096)throw Error('Слишком большой набор настроек.');tg.sendData(text);$('status').textContent='Настройки отправлены боту.';}catch(e){$('error').textContent=e.message;}}
$('previewButton').onclick=()=>action('preview');$('exportButton').onclick=()=>action('export');
try{if(!payload?.session||!payload?.image)throw Error('Открой редактор кнопкой под полем ввода в боте. Старая кнопка не подходит — снова выбери клип.');$('clipMeta').textContent=(payload.title||'Клип')+' · '+(payload.created||'Дата неизвестна');size=payload.size;data=payload.data;canvas.width=size[0];canvas.height=size[1];$('layout').value=data.layout;img.onload=()=>{loaded=true;controls();draw();$('status').textContent='Выдели области на обложке клипа.';$('previewButton').disabled=false;$('exportButton').disabled=false;};img.onerror=()=>{$('error').textContent='Не удалось загрузить обложку Twitch. Проверь соединение на телефоне.';$('status').textContent='';};img.src=payload.image;}catch(e){$('status').textContent='';$('error').textContent=e.message;}
</script></body></html>
